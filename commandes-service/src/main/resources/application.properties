spring.application.name=commandes-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:commandesdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

resilience4j.retry.instances.succursalesService.max-attempts=3
resilience4j.retry.instances.succursalesService.wait-duration=500ms
resilience4j.retry.instances.succursalesService.retry-exceptions=feign.RetryableException

resilience4j.retry.instances.menuService.max-attempts=3
resilience4j.retry.instances.menuService.wait-duration=500ms
resilience4j.retry.instances.menuService.retry-exceptions=feign.RetryableException

resilience4j.circuitbreaker.instances.succursalesService.sliding-window-size=10
resilience4j.circuitbreaker.instances.succursalesService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.succursalesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.succursalesService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.succursalesService.record-exceptions=feign.RetryableException

resilience4j.circuitbreaker.instances.menuService.sliding-window-size=10
resilience4j.circuitbreaker.instances.menuService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.menuService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.menuService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.menuService.record-exceptions=feign.RetryableException

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
