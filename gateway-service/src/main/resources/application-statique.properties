spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=succursales-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SUCCURSALES-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/succursales/**

spring.cloud.gateway.server.webflux.routes[1].id=menu-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MENU-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/plats/**

spring.cloud.gateway.server.webflux.routes[2].id=commandes-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMANDES-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/commandes/**
