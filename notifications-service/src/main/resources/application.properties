spring.application.name=notifications-service
server.port=8084

spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifications-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.restochain.notificationsservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.restochain.notificationsservice.event.CommandeEvent

management.endpoints.web.exposure.include=health,info,metrics
